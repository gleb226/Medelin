<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 - Сторінку не знайдено</title>
        <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ50BUE2d30GBASKRdrCoBgrFBfvjFTiAKCYA&s" type="image/png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
        <style>
            :root {
                --color-coffee: #6f4e37;
                --color-bg: #f8f9fa;
                --color-text: #2d3436;
                --color-cream: #f4ece1;
            }

            * { box-sizing: border-box; margin: 0; padding: 0; }

            body {
                font-family: 'Manrope', sans-serif;
                background-color: var(--color-bg);
                color: var(--color-text);
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 2rem;
                transition: background-color 0.5s ease;
            }

            .container { max-width: 400px; width: 100%; }

            .logo {
                font-family: 'Marcellus', serif;
                font-size: 2.5rem;
                letter-spacing: 4px;
                color: var(--color-coffee);
                text-decoration: none;
                margin-bottom: 2rem;
                cursor: pointer;
                user-select: none;
                display: inline-block;
            }

            h1 { font-size: 6rem; font-weight: 800; opacity: 0.1; line-height: 1; }
            p { font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.6; }

            .btn {
                padding: 0.8rem 2rem;
                background-color: var(--color-coffee);
                color: white;
                text-decoration: none;
                border-radius: 30px;
                font-weight: 600;
                transition: all 0.3s;
                border: none;
                cursor: pointer;
                width: 100%;
                font-family: 'Manrope', sans-serif;
            }

            .btn:hover { opacity: 0.9; transform: translateY(-2px); }

            #login-form {
                display: none;
                background: white;
                padding: 2.5rem;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.05);
                text-align: left;
            }

            .form-group { margin-bottom: 1.5rem; }
            .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: var(--color-coffee); }
            .form-group input {
                width: 100%;
                padding: 0.8rem 1rem;
                border-radius: 12px;
                border: 2px solid #eee;
                outline: none;
                font-family: inherit;
                transition: border-color 0.3s;
            }
            .form-group input:focus { border-color: var(--color-coffee); }

            #two-fa-section { display: none; }
            .status-msg { margin-top: 1rem; font-size: 0.85rem; color: #e74c3c; min-height: 1.2rem; }
            .loading { opacity: 0.5; pointer-events: none; }

            /* Verification Pulse Animation */
            .verify-pulse {
                width: 80px; height: 80px; background: rgba(111, 78, 55, 0.05);
                border-radius: 50%; margin: 2rem auto; display: flex; align-items: center; justify-content: center;
                position: relative;
            }
            .verify-pulse::after {
                content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
                border: 4px solid var(--color-coffee); border-radius: 50%;
                animation: pulse 2s infinite;
            }
            @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
            @keyframes fade { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        </style>
    </head>
    <body>
        <div class="container" id="main-container">
            <div class="logo" id="secret-logo">MEDELIN</div>
            
            <div id="not-found-content">
                <h1 style="opacity: 0.1; font-size: 8rem;">404</h1>
                <h2 style="font-family: 'Marcellus', serif; margin-bottom: 1rem; color: var(--color-coffee);">Сторінку не знайдено</h2>
                <p style="margin-bottom: 3rem;">На жаль, ми не змогли знайти сторінку, яку ви шукаєте.</p>
                <a href="/" class="btn">Повернутися на головну</a>
            </div>
        </div>

        <script>
            const logo = document.getElementById('secret-logo');
            logo.addEventListener('click', () => {
                window.location.href = '/';
            });
        </script>
    </body>
    </body>
</html>
