<!DOCTYPE html>

<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Medelin | Admin Panel</title>
<link href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ50BUE2d30GBASKRdrCoBgrFBfvjFTiAKCYA&amp;s" rel="icon" type="image/png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&amp;family=Marcellus&amp;family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>

<link href="assets/css/pages/admin-panel.css" rel="stylesheet"/></head>
<body>
<button class="sidebar-toggle admin-inline-button-1" id="menu-toggle">
<i class="fas fa-bars"></i>
</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div id="login-screen">
<div class="login-card">
<div id="login-form">
<h1 class="login-logo">MEDELIN</h1>
<p class="login-subtitle">Admin Dashboard</p>
<div class="input-group">
<label class="input-label">Ідентифікатор</label>
<input class="login-input" id="login-id" onkeyup="if(event.key==='Enter') attemptLogin()" placeholder="TG ID, @username або телефон" type="text"/>
</div>
<div class="input-group">
<label class="input-label">Пароль панелі</label>
<input class="login-input" id="login-pass" onkeyup="if(event.key==='Enter') attemptLogin()" placeholder="••••••••" type="password"/>
</div>
<button class="btn btn--primary btn--block" onclick="attemptLogin()">Авторизуватися</button>
</div>
<div id="verify-state">
<h2 class="admin-inline-h2-2">Очікування...</h2>
<p class="admin-inline-p-3">Ми надіслали повідомлення в Telegram.<br/>Будь ласка, підтвердьте або відхиліть вхід у боті.</p>
<div class="verify-pulse"><i class="fab fa-telegram-plane admin-inline-i-4"></i></div>
<button class="btn btn--outline" onclick="resetLogin()">Скасувати</button>
</div>
</div>
</div>
<aside class="sidebar" id="sidebar">
<div class="sidebar__header">
<span class="sidebar__logo">MEDELIN</span>
</div>
<nav class="sidebar__nav">
<a class="nav-item nav-item--active" data-section="new_orders"><i class="fas fa-bell"></i> Нові</a>
<a class="nav-item" data-section="orders"><i class="fas fa-shopping-bag"></i> Активні</a>
<a class="nav-item" data-section="beans"><i class="fas fa-coffee"></i> Зерно</a>
<a class="nav-item" data-section="locations"><i class="fas fa-map-marker-alt"></i> Локації</a>
<a class="nav-item" data-section="socials"><i class="fas fa-hashtag"></i> Контакти</a>
<a class="nav-item" data-section="stats"><i class="fas fa-chart-line"></i> Статистика</a>
<a class="nav-item" data-section="team"><i class="fas fa-users-gear"></i> Персонал</a>
<a class="nav-item admin-inline-a-5" href="/"><i class="fas fa-external-link-alt"></i> На сайт</a>
</nav>
</aside>
<main class="main-content" id="main-content">
<header class="header">
<div>
<h2 class="header__title" id="section-title">Нові замовлення</h2>
<p class="admin-inline-p-6" id="admin-info"></p>
</div>
<div class="header__actions">
<button class="btn btn--outline" onclick="logout()">Вийти</button>
</div>
</header>
<div id="content-area"><div class="card"><div id="items-list">Завантаження...</div></div></div>
</main>
<div class="confirm-modal" id="nice-confirm">
<div class="confirm-panel">
<i class="fas fa-exclamation-triangle admin-inline-i-7"></i>
<h4 id="nice-confirm-title">Ви впевнені?</h4>
<p id="nice-confirm-msg">Цю дію неможливо буде скасувати.</p>
<div class="confirm-actions">
<button class="btn btn--outline btn--sm" id="nice-confirm-cancel">Скасувати</button>
<button class="btn btn--danger btn--sm" id="nice-confirm-ok">Так, видалити</button>
</div>
</div>
</div>
<div class="confirm-modal" id="nice-alert">
<div class="confirm-panel">
<i class="fas fa-info-circle admin-inline-i-8"></i>
<h4 id="nice-alert-title">Увага</h4>
<p id="nice-alert-msg"></p>
<div class="confirm-actions">
<button class="btn btn--primary btn--sm" id="nice-alert-ok">ОК</button>
</div>
</div>
</div>
<div class="full-image-modal" id="image-modal" onclick="this.style.display='none'"><img id="full-img" src=""/></div>
<div class="loader-wrap" id="loader"><div class="spinner"></div></div>
<div class="admin-modal" id="admin-modal"></div>
<script>
            let sessionToken = localStorage.getItem('medelin_admin_token') || '';
            let currentAdmin = JSON.parse(localStorage.getItem('medelin_admin_user') || 'null');
            let currentSection = 'new_orders';
            let verifyInterval = null;
            let lastActivity = Date.now();

            window.fixImageUrl = function(url) {
                if (!url) return 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400&q=80';
                if (url.startsWith('http')) return url;
                if (url.startsWith('/uploads/') || url.startsWith('/photos/') || url.startsWith('/assets/')) return url;
                return '/uploads/' + url;
            };

            function showFullImage(url) {
                const modal = document.getElementById('image-modal');
                const img = document.getElementById('full-img');
                img.src = window.fixImageUrl(url);
                modal.style.display = 'flex';
            }

            function niceAlert(title, msg) {
                document.getElementById('nice-alert-title').textContent = title;
                document.getElementById('nice-alert-msg').textContent = msg;
                const modal = document.getElementById('nice-alert');
                modal.style.display = 'flex';
                document.getElementById('nice-alert-ok').onclick = () => { modal.style.display = 'none'; };
                modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
            }

            setInterval(() => {
                if (sessionToken && (Date.now() - lastActivity > 2 * 60 * 60 * 1000)) { logout(); }
            }, 60000);

            function updateActivity() { lastActivity = Date.now(); }
            window.onmousemove = updateActivity;
            window.onkeydown = updateActivity;

            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            function toggleMenu() {
                sidebar.classList.toggle('sidebar--active');
                overlay.classList.toggle('sidebar-overlay--active');
            }

            menuToggle.onclick = toggleMenu;
            overlay.onclick = toggleMenu;

            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const sec = item.getAttribute('data-section');
                    if (!sec) return;
                    currentSection = sec;
                    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('nav-item--active'));
                    item.classList.add('nav-item--active');
                    document.getElementById('section-title').textContent = item.textContent.trim();
                    if (window.innerWidth <= 768 || (window.innerWidth <= 1024 && window.innerHeight > window.innerWidth)) {
                        sidebar.classList.remove('sidebar--active');
                        overlay.classList.remove('sidebar-overlay--active');
                    }
                    refreshData();
                });
            });

            async function checkSession() {
                if (!sessionToken || sessionToken === 'undefined') { 
                    sessionToken = ''; localStorage.removeItem('medelin_admin_token'); return; 
                }
                const admin = await apiFetch('me');
                if (admin) {
                    currentAdmin = admin;
                    localStorage.setItem('medelin_admin_user', JSON.stringify(admin));
                    document.getElementById('login-screen').classList.add('login-screen--hidden');
                    showPanel();
                } else {
                    console.error('Session invalid or error fetching admin data');
                }
            }

            window.onload = () => {
                const urlParams = new URLSearchParams(window.location.search);
                const urlAuth = urlParams.get('auth');
                if (urlAuth) {
                    sessionToken = urlAuth;
                    localStorage.setItem('medelin_admin_token', urlAuth);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
                if (sessionToken) checkSession();
            };

            async function attemptLogin() {
                const id = document.getElementById('login-id').value;
                const pass = document.getElementById('login-pass').value;
                if (!id || !pass) { niceAlert('Увага', 'Введіть дані'); return; }
                showLoader(true);
                try {
                    const resp = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identifier: id, password: pass })
                    });
                    if (!resp.ok) { const err = await resp.json(); throw new Error(err.detail || 'Помилка'); }
                    const data = await resp.json();
                    startVerification(data.user_id);
                } catch (e) { niceAlert('Помилка', e.message); } finally { showLoader(false); }
            }

            function startVerification(userId) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('verify-state').style.display = 'block';
                verifyInterval = setInterval(async () => {
                    try {
                        const resp = await fetch(`/api/admin/verify?user_id=${userId}`);
                        const data = await resp.json();
                        if (data.status === 'ok') { clearInterval(verifyInterval); finishLogin(data.token, data.admin); }
                        if (data.status === 'rejected') {
                            resetLogin();
                            niceAlert('Вхід відхилено', data.message || 'Запит на вхід було відхилено в Telegram.');
                        }
                    } catch (e) {}
                }, 2000);
            }

            function finishLogin(token, admin) {
                sessionToken = token; currentAdmin = admin;
                localStorage.setItem('medelin_admin_token', token);
                localStorage.setItem('medelin_admin_user', JSON.stringify(admin));

                // Instead of reload, just transition UI
                document.getElementById('login-screen').classList.add('login-screen--hidden');
                showPanel();
            }

            function showPanel() {
                document.getElementById('admin-info').textContent = `${currentAdmin.name} (${roleName(currentAdmin.role)})`;
                const role = currentAdmin.role;
                const isOwner = ['owner', 'boss', 'super'].includes(role);
                const isAdmin = role === 'admin';
                const isDeveloper = role === 'developer';

                document.querySelectorAll('.nav-item[data-section]').forEach(item => {
                    const sec = item.getAttribute('data-section');
                    if (isDeveloper) {
                        item.style.display = ''; // Ensure all are visible for developer
                        return;
                    }

                    if (isAdmin) {
                        if (sec !== 'new_orders' && sec !== 'orders') item.style.display = 'none';
                    } else if (isOwner) {
                        // Owner sees all but stats (as before)
                        if (sec === 'stats') item.style.display = 'none';
                    }
                });
                refreshData();
            }

            function logout() { localStorage.clear(); window.location.href = '/admin-panel'; }
            function resetLogin() { clearInterval(verifyInterval); document.getElementById('login-form').style.display = 'block'; document.getElementById('verify-state').style.display = 'none'; }
            function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
            function roleName(role) { return ({ developer: 'Розробник', owner: 'Власник', admin: 'Адмін' }[role] || role); }

            async function apiFetch(endpoint, method = 'GET', body = null) {
                const options = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` } };
                if (body) options.body = JSON.stringify(body);
                try {
                    const resp = await fetch(`/api/admin/${endpoint}`, options);
                    if (resp.status === 401) return logout();
                    if (!resp.ok) {
                        let msg = 'Помилка виконання';
                        try {
                            const err = await resp.json();
                            msg = err.detail || msg;
                        } catch(e) {
                            msg = `Помилка ${resp.status}: ${resp.statusText}`;
                        }
                        // Use niceConfirm for error messages instead of alert
                        niceConfirm('Помилка', msg, () => {}); // A simple OK button popup
                        return null;
                    }
                    return await resp.json();
                } catch(e) {
                    console.error('API Fetch Error:', e);
                    niceConfirm('Помилка мережі', 'Помилка мережі або сервера', () => {});
                    return null;
                }
            }

            async function niceConfirm(title, msg, onOk, onCancel = null, okText = 'Так', cancelText = 'Скасувати', okBtnClass = 'btn--danger', cancelBtnClass = 'btn--outline') {
                const modal = document.getElementById('nice-confirm');
                document.getElementById('nice-confirm-title').textContent = title;
                document.getElementById('nice-confirm-msg').textContent = msg;

                const okBtn = document.getElementById('nice-confirm-ok');
                const cancelBtn = document.getElementById('nice-confirm-cancel');

                okBtn.textContent = okText;
                okBtn.className = `btn ${okBtnClass} btn--sm`;
                cancelBtn.textContent = cancelText;
                cancelBtn.className = `btn ${cancelBtnClass} btn--sm`;

                const cleanup = () => { modal.style.display = 'none'; okBtn.onclick = null; cancelBtn.onclick = null; };

                okBtn.onclick = () => { cleanup(); onOk(); };
                cancelBtn.onclick = () => { cleanup(); if (onCancel) onCancel(); };

                modal.style.display = 'flex';
            }

            async function loadNewOrders() {
                showLoader(true);
                const orders = await apiFetch('new-orders');
                const list = document.getElementById('items-list');
                if (!orders || orders.length === 0) { list.innerHTML = '<p class="js-inline-style-100">Немає нових замовлень</p>'; showLoader(false); return; }
                list.innerHTML = '';
                const role = currentAdmin.role;
                const isOwner = ['owner', 'boss', 'super'].includes(role);
                const isAdmin = role === 'admin';
                const isDeveloper = role === 'developer';
                const canManage = isOwner || isAdmin;

                orders.forEach(o => {
                    const div = document.createElement('div'); div.className = 'order-item';
                    const date = o.created_at ? new Date(o.created_at).toLocaleString('uk-UA') : '—';
                    const num = o.order_number && o.order_number !== '—' ? o.order_number : '—';

                    // Construct delivery info
                    let deliveryInfo = '';
                    if (o.order_type === 'beans_delivery') {
                        const branch = o.delivery_branch_id ? `Відділення №${o.delivery_branch_id}` : '';
                        const dt = o.delivery_type === 'branch' ? 'Відділення' : (o.delivery_type === 'courier' ? "Кур'єр" : (branch ? 'Відділення' : "Кур'єр"));
                        let adr = `<i class="fas fa-truck js-inline-style-101" ></i> Куди: ${dt} ${o.delivery_city || ''}, ${o.delivery_state || ''}, ${branch ? branch + ': ' : ''}${o.delivery_address || ''}`;
                        deliveryInfo = adr.replace(', ,', ',').replace(' ,', ',');
                    } else if (o.order_type === 'beans_booking' && o.location_name) {
                        deliveryInfo = `<i class="fas fa-map-marker-alt js-inline-style-102" ></i> Куди: Самовивіз: ${o.location_name}`;
                    } else if (o.order_type === 'takeaway' && o.location_name) {
                        deliveryInfo = `<i class="fas fa-walking js-inline-style-103" ></i> Куди: З собою: ${o.location_name}`;
                    } else if (o.order_type === 'in_house' && o.location_name) {
                        deliveryInfo = `<i class="fas fa-coffee js-inline-style-104" ></i> Куди: В залі: ${o.location_name}`;
                    } else {
                        deliveryInfo = o.delivery_info ? `<i class="fas fa-info-circle js-inline-style-105" ></i> ${o.delivery_info}` : '—';
                    }

                    let paymentStr = (o.status === 'paid' || o.is_paid) ? 'ОПЛАЧЕНО' : 'НАКЛАДНИЙ ПЛАТІЖ';

                    // Construct cart items
                    let cartItems = '';
                    if (Array.isArray(o.cart) && o.cart.length > 0) {
                        cartItems = o.cart.map(item => `— ${item.name} (${item.price * (item.quantity || 1)} грн)`).join('<br>');
                    } else if (typeof o.cart === 'string') {
                        cartItems = o.cart; // Fallback for old string format
                    }

                    div.innerHTML = `
                        <div class="order-info">
                            <div class="order-title"><i class="fas fa-box js-inline-style-106" ></i> ЗАМОВЛЕННЯ #${num} (${o.status === 'new' ? 'НОВЕ' : 'АКТИВНЕ'})</div>
                            <div class="order-meta">
                                <div><i class="fas fa-user js-inline-style-107" ></i> ${o.fullname || o.username || '—'}</div>
                                <div><i class="fas fa-phone js-inline-style-108" ></i> ${o.phone || '—'}</div>
                                ${deliveryInfo && deliveryInfo !== '—' ? `<div>${deliveryInfo}</div>` : ''}
                                <div><i class="fas fa-money-bill-wave js-inline-style-109" ></i> Сума: ${o.total_amount || o.total || 0} ₴</div>
                                <div><i class="fas fa-credit-card js-inline-style-110" ></i> Оплата: ${paymentStr}</div>
                            </div>
                            <div class="order-items">
                                <b><i class="fas fa-shopping-cart js-inline-style-111" ></i> Товари:</b><br>${cartItems || 'Немає товарів'}
                                ${o.wishes ? `<br><br><b><i class="fas fa-sticky-note js-inline-style-112" ></i> ПОБАЖАННЯ:</b> ${o.wishes}` : ''}
                            </div>
                        </div>
                        <div class="order-actions">
                            ${canManage && !isDeveloper ? `
                            <button class="btn btn--success btn--sm" onclick="confirmOrder('${o.order_id}')">Підтвердити</button>
                            <button class="btn btn--danger btn--sm" onclick="rejectOrder('${o.order_id}')">Відхилити</button>
                            ` : ''}
                        </div>`;
                    list.appendChild(div);
                });
                showLoader(false);
            }

            async function confirmOrder(oid) { const res = await apiFetch(`orders/${oid}/confirm`, 'POST'); if (res) refreshData(); }
            async function rejectOrder(oid) { niceConfirm('Скасування', 'Видалити та відхилити замовлення?', async () => { const res = await apiFetch(`orders/${oid}/reject`, 'POST'); if (res) refreshData(); }); }

            async function loadOrders() {
                showLoader(true);
                const orders = await apiFetch('active-orders');
                const list = document.getElementById('items-list');
                if (!orders || orders.length === 0) { list.innerHTML = '<p class="js-inline-style-113">Немає активних замовлень</p>'; showLoader(false); return; }
                list.innerHTML = '';
                const role = currentAdmin.role;
                const isOwner = ['owner', 'boss', 'super'].includes(role);
                const isAdmin = role === 'admin';
                const isDeveloper = role === 'developer';
                const canManage = isOwner || isAdmin;

                orders.forEach(o => {
                    const div = document.createElement('div'); div.className = 'order-item';
                    const num = o.order_number && o.order_number !== '—' ? o.order_number : '—';

                    // Construct delivery info
                    let deliveryInfo = '';
                    if (o.order_type === 'beans_delivery') {
                        const branch = o.delivery_branch_id ? `Відділення №${o.delivery_branch_id}` : '';
                        const dt = o.delivery_type === 'branch' ? 'Відділення' : (o.delivery_type === 'courier' ? "Кур'єр" : (branch ? 'Відділення' : "Кур'єр"));
                        let adr = `<i class="fas fa-truck js-inline-style-114" ></i> Куди: ${dt} ${o.delivery_city || ''}, ${o.delivery_state || ''}, ${branch ? branch + ': ' : ''}${o.delivery_address || ''}`;
                        deliveryInfo = adr.replace(', ,', ',').replace(' ,', ',');
                    } else if (o.order_type === 'beans_booking' && o.location_name) {
                        deliveryInfo = `<i class="fas fa-map-marker-alt js-inline-style-115" ></i> Куди: Самовивіз: ${o.location_name}`;
                    } else if (o.order_type === 'takeaway' && o.location_name) {
                        deliveryInfo = `<i class="fas fa-walking js-inline-style-116" ></i> Куди: З собою: ${o.location_name}`;
                    } else if (o.order_type === 'in_house' && o.location_name) {
                        deliveryInfo = `<i class="fas fa-coffee js-inline-style-117" ></i> Куди: В залі: ${o.location_name}`;
                    } else {
                        deliveryInfo = o.delivery_info ? `<i class="fas fa-info-circle js-inline-style-118" ></i> ${o.delivery_info}` : '—';
                    }

                    let paymentStr = (o.status === 'paid' || o.is_paid) ? 'ОПЛАЧЕНО' : 'НАКЛАДНИЙ ПЛАТІЖ';

                    // Construct cart items
                    let cartItems = '';
                    if (Array.isArray(o.cart) && o.cart.length > 0) {
                        cartItems = o.cart.map(item => `— ${item.name} (${item.price * (item.quantity || 1)} грн)`).join('<br>');
                    } else if (typeof o.cart === 'string') {
                        cartItems = o.cart; // Fallback for old string format
                    }

                    div.innerHTML = `
                        <div class="order-info">
                            <div class="order-title"><i class="fas fa-box js-inline-style-119" ></i> ЗАМОВЛЕННЯ #${num} (АКТИВНЕ)</div>
                            <div class="order-meta">
                                <div><i class="fas fa-user js-inline-style-120" ></i> ${o.fullname || o.username || '—'}</div>
                                <div><i class="fas fa-phone js-inline-style-121" ></i> ${o.phone || '—'}</div>
                                ${deliveryInfo && deliveryInfo !== '—' ? `<div>${deliveryInfo}</div>` : ''}
                                <div><i class="fas fa-money-bill-wave js-inline-style-122" ></i> Сума: ${o.total_amount || o.total || 0} ₴</div>
                                <div><i class="fas fa-credit-card js-inline-style-123" ></i> Оплата: ${paymentStr}</div>
                            </div>
                            <div class="order-items">
                                <b><i class="fas fa-shopping-cart js-inline-style-124" ></i> Товари:</b><br>${cartItems || 'Немає товарів'}
                                ${o.wishes ? `<br><br><b><i class="fas fa-sticky-note js-inline-style-125" ></i> ПОБАЖАННЯ:</b> ${o.wishes}` : ''}
                            </div>
                        </div>
                        <div class="order-actions">
                            ${canManage && !isDeveloper ? `<button class="btn btn--success btn--sm" onclick="completeOrder('${o.order_id}')">Завершити</button>` : ''}
                        </div>`;
                    list.appendChild(div);
                });
                showLoader(false);
            }

            async function completeOrder(oid) { await apiFetch(`orders/${oid}/complete`, 'POST'); refreshData(); }

            async function loadBeans() {
                showLoader(true);
                const beans = await apiFetch('beans');
                const list = document.getElementById('items-list');
                if (!beans) { list.innerHTML = 'Немає доступу'; showLoader(false); return; }
                const role = currentAdmin.role;
                const isOwner = ['owner', 'boss', 'super'].includes(role);
                const isDeveloper = role === 'developer';
                list.innerHTML = `<div class="admin-toolbar"><h3>Зерно</h3>${(isOwner && !isDeveloper) ? `<button class="btn btn--primary btn--sm" onclick="openBeanModal()">+ Додати</button>` : ''}</div><div id="beans-grid" class="admin-grid"></div>`;
                beans.forEach(b => {
                    const div = document.createElement('div'); div.className = 'bean-card';
                    div.style.cursor = 'pointer';
                    div.onclick = () => openBeanDetail(b);
                    div.innerHTML = `
                        <img src="${window.fixImageUrl(b.image_url)}" class="card-img">
                        <div class="card-body js-inline-style-126" >
                            <div class="card-title">${b.name}</div>
                        </div>`;
                    document.getElementById('beans-grid').appendChild(div);
                });
                showLoader(false);
            }

            function openBeanDetail(b) {
                const modal = document.getElementById('admin-modal');
                const role = currentAdmin.role;
                const isOwner = ['owner', 'boss', 'super'].includes(role);
                const isDeveloper = role === 'developer';

            async function loadSocials() {

                const SOCIAL_ICONS = {
                    instagram: 'fab fa-instagram',
                    facebook: 'fab fa-facebook-f',
                    email: 'fas fa-envelope',
                    phone: 'fas fa-phone-alt',
                    github: 'fab fa-github',
                    tiktok: 'fab fa-tiktok',
                    telegram: 'fab fa-telegram',
                    viber: 'fab fa-viber',
                    youtube: 'fab fa-youtube',
                };

                const guessSocialKeyFromUrl = (url) => {
                    const u = String(url || '').toLowerCase().trim();
                    if (u.includes('instagram.')) return 'instagram';
                    if (u.includes('tiktok.')) return 'tiktok';
                    if (u.includes('facebook.') || u.includes('fb.')) return 'facebook';
                    if (u.includes('youtube.') || u.includes('youtu.be')) return 'youtube';
                    if (u.includes('telegram.') || u.includes('t.me/')) return 'telegram';
                    if (u.includes('viber.')) return 'viber';
                    if (u.includes('github.')) return 'github';
                    if (u.startsWith('tel:') || u.startsWith('+') || /^\d{7,}$/.test(u.replace(/[\s\-()]/g, ''))) return 'phone';
                    if (u.startsWith('mailto:')) return 'email';
                    return null;
                };

                socials.forEach(s => {
                    const nameKey = s.name.toLowerCase().trim();
                    const byUrl = guessSocialKeyFromUrl(s.url);
                    const icon = SOCIAL_ICONS[nameKey] || (byUrl ? SOCIAL_ICONS[byUrl] : null) || 'fas fa-link';

                    const displayUrl = s.url.replace(/^mailto:/, '').replace(/^tel:/, '');

                    const div = document.createElement('div'); div.className = 'order-item';
                    div.innerHTML = `<div class="order-info"><div class="js-inline-style-164"><i class="${icon} js-inline-style-165" ></i> ${s.name}</div><div class="js-inline-style-166">${displayUrl}</div></div>

                    document.getElementById('socials-list').appendChild(div);
                });
                showLoader(false);
            }

                        <div class="admin-field js-inline-style-191" ><label>Ім'я в команді</label><input name="display_name" placeholder="Наприклад: Олександр" required></div>
                        <div class="admin-field js-inline-style-192" ><label>Роль</label>
                            <select name="role">
                                ${isDeveloper ? '<option value="owner">Власник</option>' : `
                                <option value="admin">Адмін</option>
                                <option value="owner">Власник</option>
                                `}
                            </select>
                        </div>
                    </form><div class="admin-modal__footer"><button onclick="saveTeam()" class="btn btn--primary btn--block">Зберегти</button></div></div>`;
                modal.classList.add('admin-modal--active');
            }

            async function saveTeam() { 
                const form = document.getElementById('team-form'); 
                const fd = new FormData(form); 
                const data = Object.fromEntries(fd.entries());

                showLoader(true);
                const res = await apiFetch('team', 'POST', data); 
                showLoader(false);
                if (res) { closeAdminModal(); refreshData(); } 
            }
            async function deleteTeam(id) { niceConfirm('Видалення', 'Видалити цього співробітника?', async () => { await apiFetch(`team/${id}`, 'DELETE'); refreshData(); }, null, 'Так, видалити'); }

            function closeAdminModal() { document.getElementById('admin-modal').classList.remove('admin-modal--active'); }

            function toggleQualityScore(val) {
                const field = document.getElementById('quality-score-field');
                if (field) field.style.display = val === 'specialty' ? 'block' : 'none';
            }

            function refreshData() {
                if (currentSection === 'new_orders') loadNewOrders();
                else if (currentSection === 'orders') loadOrders();
                else if (currentSection === 'beans') loadBeans();
                else if (currentSection === 'locations') loadLocations();
                else if (currentSection === 'socials') loadSocials();
                else if (currentSection === 'stats') loadStats();
                else if (currentSection === 'team') loadTeam();
            }

            if (sessionToken && currentAdmin) { document.getElementById('login-screen').classList.add('login-screen--hidden'); showPanel(); }
        </script>
</body>
</html>
