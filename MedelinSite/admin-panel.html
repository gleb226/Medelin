<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Medelin | Admin Panel</title>
        <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ50BUE2d30GBASKRdrCoBgrFBfvjFTiAKCYA&s" type="image/png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Marcellus&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
        <style>
            :root {
                --color-cream: #f7f3e9;
                --color-dark-brown: #3c2f2f;
                --color-coffee: #8b5e3c;
                --color-coffee-soft: rgba(139, 94, 60, 0.1);
                --color-text: #2d3436;
                --color-text-muted: #636e72;
                --sidebar-width: 280px;
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
                --radius: 20px;
                --font-main: 'Manrope', sans-serif;
                --font-accent: 'Marcellus', serif;
                --font-logo: 'Oswald', sans-serif;
                --color-success: #00b894;
                --color-danger: #d63031;
                --color-warning: #fdcb6e;
            }

            * { box-sizing: border-box; margin: 0; padding: 0; }

            body {
                font-family: var(--font-main);
                background-color: var(--color-cream);
                color: var(--color-text);
                display: flex;
                min-height: 100vh;
                overflow-x: hidden;
            }

            html, body { scrollbar-width: none; -ms-overflow-style: none; }
            html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

            #login-screen {
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: linear-gradient(135deg, var(--color-cream) 0%, #e8e2d5 100%);
                display: flex; justify-content: center; align-items: center;
                z-index: 5000; transition: all 0.5s ease;
                padding: 1rem;
            }

            .login-card {
                background: white; padding: clamp(1.5rem, 5vw, 4rem); border-radius: 40px;
                box-shadow: 0 30px 80px rgba(60, 47, 47, 0.15);
                width: 100%; max-width: 500px; text-align: center;
                border: 1px solid rgba(139, 94, 60, 0.1);
            }

            .login-logo { font-family: var(--font-logo); font-size: clamp(2.5rem, 10vw, 3.5rem); color: var(--color-dark-brown); margin-bottom: 0.5rem; letter-spacing: 2px; text-transform: uppercase; }
            .login-subtitle { color: var(--color-coffee); font-weight: 800; font-size: clamp(0.7rem, 2vw, 0.85rem); letter-spacing: 4px; margin-bottom: clamp(1.5rem, 5vw, 3rem); text-transform: uppercase; }

            .input-group { margin-bottom: 1.8rem; text-align: left; }
            .input-label { display: block; margin-bottom: 0.8rem; font-weight: 800; font-size: 0.85rem; color: var(--color-dark-brown); text-transform: uppercase; letter-spacing: 1px; }
            .login-input {
                width: 100%; padding: 1.3rem; border-radius: 18px; border: 2px solid var(--color-coffee-soft);
                font-family: var(--font-main); font-size: 1rem; outline: none; transition: all 0.3s;
                background: #fdfcf9;
            }
            .login-input:focus { border-color: var(--color-coffee); background: #fff; box-shadow: 0 0 0 5px var(--color-coffee-soft); }

            #verify-state { display: none; }
            .verify-pulse {
                width: 100px; height: 100px; background: var(--color-coffee-soft);
                border-radius: 50%; margin: 2.5rem auto; display: flex; align-items: center; justify-content: center;
                position: relative;
            }
            .verify-pulse::after {
                content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
                border: 4px solid var(--color-coffee); border-radius: 50%;
                animation: pulse 2s infinite;
            }
            @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }

            .sidebar {
                width: var(--sidebar-width); background: var(--color-dark-brown);
                color: white; display: flex; flex-direction: column; position: fixed; height: 100vh;
                transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                z-index: 2000; box-shadow: 15px 0 40px rgba(0,0,0,0.15);
            }

            .main-content {
                flex: 1; margin-left: var(--sidebar-width); padding: clamp(1.5rem, 4vw, 4rem);
                width: calc(100% - var(--sidebar-width)); transition: all 0.4s ease;
            }

            .sidebar__header { padding: 4rem 2rem; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
            .sidebar__logo { font-family: var(--font-logo); font-size: 2.4rem; letter-spacing: 4px; color: white; text-decoration: none; display: block; text-transform: uppercase; }
            .sidebar__nav { flex: 1; padding: 2.5rem 0; overflow-y: auto; display: flex; flex-direction: column; }
            .nav-item { padding: 1.3rem 2.5rem; display: flex; align-items: center; gap: 1.2rem; cursor: pointer; transition: all 0.3s ease; color: rgba(255, 255, 255, 0.5); text-decoration: none; font-weight: 600; border-left: 5px solid transparent; font-size: 0.95rem; }
            .nav-item:hover, .nav-item--active { background-color: rgba(255, 255, 255, 0.05); color: white; border-left-color: var(--color-coffee); }
            .nav-item i { width: 24px; text-align: center; font-size: 1.3rem; opacity: 0.8; }

            .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4rem; gap: 2rem; flex-wrap: wrap; }
            .header__title { font-family: var(--font-accent); font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 400; color: var(--color-dark-brown); }

            .card { background: white; border-radius: 30px; padding: clamp(1.5rem, 4vw, 3rem); box-shadow: var(--shadow); margin-bottom: 2.5rem; border: 1px solid rgba(139, 94, 60, 0.05); overflow: hidden; }

            .btn { padding: 1rem 2rem; border-radius: 16px; border: none; cursor: pointer; font-weight: 800; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-family: var(--font-main); display: inline-flex; align-items: center; gap: 10px; text-decoration: none; white-space: nowrap; font-size: 0.95rem; }
            .btn--primary { background-color: var(--color-coffee); color: white; box-shadow: 0 8px 25px rgba(139, 94, 60, 0.25); }
            .btn--primary:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(139, 94, 60, 0.35); }
            .btn--block { width: 100%; justify-content: center; padding: 1.4rem; font-size: 1.1rem; }
            .btn--success { background-color: var(--color-success); color: white; }
            .btn--danger { background-color: var(--color-danger); color: white; }
            .btn--outline { background: transparent; border: 2.5px solid var(--color-coffee); color: var(--color-coffee); }
            .btn--sm { padding: 0.6rem 1.2rem; font-size: 0.85rem; border-radius: 12px; }

            .order-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.04); padding: 2rem 0; gap: 2rem; }
            .order-item:last-child { border-bottom: none; }
            .order-info { display: flex; flex-direction: column; gap: 0.6rem; flex: 1; }
            .order-title { font-weight: 800; font-size: 1.3rem; color: var(--color-dark-brown); }
            .order-meta { color: var(--color-text-muted); font-size: 1rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
            .order-items { margin-top: 1rem; font-size: 1.05rem; color: #444; background: #fdfaf5; padding: 1.5rem; border-radius: 20px; border: 1px solid rgba(139, 94, 60, 0.03); line-height: 1.6; }
            .order-actions { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: flex-end; }

            .admin-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap; padding-bottom: 1rem; border-bottom: 2px solid var(--color-coffee-soft); }
            .admin-toolbar h3 { font-family: var(--font-accent); color: var(--color-dark-brown); font-size: 2rem; font-weight: 400; }
            .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
            
            .admin-field { display: flex; flex-direction: column; gap: 0.6rem; }
            .admin-field label { font-size: 0.8rem; font-weight: 800; color: var(--color-dark-brown); text-transform: uppercase; letter-spacing: 1px; }
            .admin-field input, .admin-field select, .admin-field textarea {
                width: 100%; padding: 1rem 1.2rem; border: 2px solid var(--color-coffee-soft);
                border-radius: 15px; font-family: var(--font-main); font-size: 0.95rem; outline: none; background: white; transition: all 0.3s;
            }
            .admin-field input:focus { border-color: var(--color-coffee); box-shadow: 0 0 0 4px var(--color-coffee-soft); }

            .admin-modal { position: fixed; inset: 0; background: rgba(60, 47, 47, 0.6); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 1.5rem; backdrop-filter: blur(8px); }
            .admin-modal--active { display: flex; }
            .admin-modal__panel { width: min(800px, 100%); max-height: 90vh; overflow-y: auto; background: white; border-radius: 35px; padding: clamp(2rem, 5vw, 3.5rem); box-shadow: 0 40px 100px rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.2); }
            .admin-modal__panel--large { width: min(1000px, 100%); }
            .admin-modal__header { display: flex; justify-content: space-between; align-items: center; gap: 1.5rem; margin-bottom: 2.5rem; }
            .admin-modal__title { font-family: var(--font-accent); color: var(--color-dark-brown); font-size: 2.2rem; font-weight: 400; }
            .admin-modal__footer { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2.5rem; flex-wrap: wrap; }

            .loader-wrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(247, 243, 233, 0.95); display: none; justify-content: center; align-items: center; z-index: 6000; backdrop-filter: blur(5px); }
            .spinner { width: 70px; height: 70px; border: 7px solid rgba(139, 94, 60, 0.1); border-top-color: var(--color-coffee); border-radius: 50%; animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite; }
            @keyframes spin { to { transform: rotate(360deg); } }

            .sidebar-toggle {
                display: none; width: 55px; height: 55px; background: var(--color-dark-brown); color: white;
                border-radius: 18px; align-items: center; justify-content: center; cursor: pointer; border: none;
                font-size: 1.4rem; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }

            @media (max-width: 1024px) {
                .sidebar { transform: translateX(-100%); }
                .sidebar--active { transform: translateX(0); }
                .main-content { margin-left: 0; width: 100%; padding: 1.5rem; }
                .sidebar-toggle { display: flex; }
            }

            @media (max-width: 768px) {
                .header { margin-bottom: 2rem; flex-direction: column; align-items: flex-start; gap: 1rem; }
                .header__actions { width: 100%; justify-content: space-between; }
                .header__title { font-size: 1.8rem; }
                .order-item { flex-direction: column; align-items: stretch; gap: 1rem; padding: 1.5rem 0; }
                .order-actions { justify-content: flex-start; width: 100%; }
                .order-actions .btn { flex: 1; }
                .admin-toolbar { flex-direction: column; align-items: flex-start; gap: 1rem; }
                .admin-toolbar .btn { width: 100%; }
                .admin-toolbar h3 { font-size: 1.5rem; }
                .admin-modal__panel { border-radius: 20px; padding: 1.5rem; }
                .admin-modal__title { font-size: 1.6rem; }
                .admin-modal__header { margin-bottom: 1.5rem; }
                .admin-grid { grid-template-columns: 1fr; }
            }
        </style>
    </head>
    <body>
        <button class="sidebar-toggle" id="menu-toggle" style="position:fixed; top:1.5rem; right:1.5rem; z-index:2100;">
            <i class="fas fa-bars"></i>
        </button>

        <div id="login-screen">
            <div class="login-card">
                <div id="login-form">
                    <h1 class="login-logo">MEDELIN</h1>
                    <p class="login-subtitle">Admin Dashboard</p>
                    <div class="input-group">
                        <label class="input-label">Ідентифікатор</label>
                        <input type="text" id="login-id" class="login-input" placeholder="TG ID, @username або телефон">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Пароль панелі</label>
                        <input type="password" id="login-pass" class="login-input" placeholder="••••••••">
                    </div>
                    <button class="btn btn--primary btn--block" onclick="attemptLogin()">Авторизуватися</button>
                </div>
                <div id="verify-state">
                    <h2 style="font-family:var(--font-accent); font-size: 2rem; margin-bottom: 1rem;">Очікування...</h2>
                    <p style="color: var(--color-text-muted); line-height: 1.6;">Ми надіслали повідомлення в Telegram.<br>Будь ласка, натисніть <b>"ПІДТВЕРДИТИ"</b>.</p>
                    <div class="verify-pulse"><i class="fab fa-telegram-plane" style="font-size:2.5rem; color:var(--color-coffee);"></i></div>
                    <button class="btn btn--outline" onclick="resetLogin()">Скасувати</button>
                </div>
            </div>
        </div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header">
                <span class="sidebar__logo">MEDELIN</span>
            </div>
            <nav class="sidebar__nav">
                <a class="nav-item nav-item--active" data-section="new_orders"><i class="fas fa-bell"></i> Нові</a>
                <a class="nav-item" data-section="orders"><i class="fas fa-shopping-bag"></i> Активні</a>
                <a class="nav-item" data-section="beans"><i class="fas fa-coffee"></i> Зерно</a>
                <a class="nav-item" data-section="locations"><i class="fas fa-map-marker-alt"></i> Локації</a>
                <a class="nav-item" data-section="socials"><i class="fas fa-address-book"></i> Контакти</a>
                <a class="nav-item" data-section="stats"><i class="fas fa-chart-line"></i> Статистика</a>
                <a class="nav-item" data-section="broadcast"><i class="fas fa-paper-plane"></i> Розсилка</a>
                <a class="nav-item" data-section="team"><i class="fas fa-users-gear"></i> Персонал</a>
                <a href="/" class="nav-item" style="margin-top:auto; border-top:1px solid rgba(255,255,255,0.05);"><i class="fas fa-external-link-alt"></i> На сайт</a>
            </nav>
        </aside>

        <main class="main-content" id="main-content">
            <header class="header">
                <div>
                    <h2 class="header__title" id="section-title">Нові замовлення</h2>
                    <p id="admin-info" style="font-size:0.85rem; color:var(--color-coffee); font-weight:700;"></p>
                </div>
                <div class="header__actions">
                    <button class="btn btn--primary" id="refresh-btn"><i class="fas fa-sync-alt"></i> Оновити</button>
                    <button class="btn btn--outline" onclick="logout()">Вийти</button>
                </div>
            </header>
            <div id="content-area"><div class="card"><div id="items-list">Завантаження...</div></div></div>
        </main>

        <div class="loader-wrap" id="loader"><div class="spinner"></div></div>
        <div class="admin-modal" id="admin-modal"></div>

        <script>
            let sessionToken = localStorage.getItem('medelin_admin_token') || '';
            let currentAdmin = JSON.parse(localStorage.getItem('medelin_admin_user') || 'null');
            let currentSection = 'new_orders';
            let verifyInterval = null;
            let lastActivity = Date.now();

            window.fixImageUrl = function(url) {
                if (!url) return 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400&q=80';
                if (url.startsWith('http')) return url;
                if (url.startsWith('/uploads/') || url.startsWith('/photos/') || url.startsWith('/assets/')) return url;
                return '/uploads/' + url;
            };

            // Auto-logout after 2 hours
            setInterval(() => {
                if (sessionToken && (Date.now() - lastActivity > 2 * 60 * 60 * 1000)) { logout(); }
            }, 60000);

            function updateActivity() { lastActivity = Date.now(); }
            window.onmousemove = updateActivity;
            window.onkeydown = updateActivity;

            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            menuToggle.onclick = () => sidebar.classList.toggle('sidebar--active');

            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const sec = item.getAttribute('data-section');
                    if (!sec) return;
                    currentSection = sec;
                    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('nav-item--active'));
                    item.classList.add('nav-item--active');
                    document.getElementById('section-title').textContent = item.textContent.trim();
                    if (window.innerWidth <= 1024) sidebar.classList.remove('sidebar--active');
                    refreshData();
                });
            });

            async function checkSession() {
                if (!sessionToken) return;
                const admin = await apiFetch('me');
                if (admin) {
                    currentAdmin = admin;
                    localStorage.setItem('medelin_admin_user', JSON.stringify(admin));
                    document.getElementById('login-screen').style.display = 'none';
                    showPanel();
                } else { logout(); }
            }

            window.onload = () => {
                const urlParams = new URLSearchParams(window.location.search);
                const urlAuth = urlParams.get('auth');
                if (urlAuth) {
                    sessionToken = urlAuth;
                    localStorage.setItem('medelin_admin_token', urlAuth);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
                if (sessionToken) checkSession();
            };

            async function attemptLogin() {
                const id = document.getElementById('login-id').value;
                const pass = document.getElementById('login-pass').value;
                if (!id || !pass) return alert('Введіть дані');
                showLoader(true);
                try {
                    const resp = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identifier: id, password: pass })
                    });
                    if (!resp.ok) { const err = await resp.json(); throw new Error(err.detail || 'Помилка'); }
                    const data = await resp.json();
                    startVerification(data.user_id);
                } catch (e) { alert(e.message); } finally { showLoader(false); }
            }

            function startVerification(userId) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('verify-state').style.display = 'block';
                verifyInterval = setInterval(async () => {
                    try {
                        const resp = await fetch(`/api/admin/verify?user_id=${userId}`);
                        const data = await resp.json();
                        if (data.status === 'ok') { clearInterval(verifyInterval); finishLogin(data.token, data.admin); }
                    } catch (e) {}
                }, 2000);
            }

            function finishLogin(token, admin) {
                sessionToken = token; currentAdmin = admin;
                localStorage.setItem('medelin_admin_token', token);
                localStorage.setItem('medelin_admin_user', JSON.stringify(admin));
                location.reload();
            }

            function showPanel() {
                document.getElementById('admin-info').textContent = `${currentAdmin.name} (${roleName(currentAdmin.role)})`;
                const role = currentAdmin.role;
                document.querySelectorAll('.nav-item[data-section]').forEach(item => {
                    const sec = item.getAttribute('data-section');
                    if (role === 'admin') {
                        if (sec !== 'new_orders' && sec !== 'orders') item.style.display = 'none';
                    } else if (role === 'owner') {
                        if (sec === 'stats') item.style.display = 'none';
                    }
                });
                refreshData();
            }

            function logout() { localStorage.clear(); window.location.href = '/admin-panel'; }
            function resetLogin() { clearInterval(verifyInterval); document.getElementById('login-form').style.display = 'block'; document.getElementById('verify-state').style.display = 'none'; }
            function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
            function roleName(role) { return ({ developer: 'Розробник', owner: 'Власник', admin: 'Адмін' }[role] || role); }

            async function apiFetch(endpoint, method = 'GET', body = null) {
                const options = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` } };
                if (body) options.body = JSON.stringify(body);
                try {
                    const resp = await fetch(`/api/admin/${endpoint}`, options);
                    if (resp.status === 401) return logout();
                    return resp.ok ? await resp.json() : null;
                } catch(e) { return null; }
            }

            async function loadNewOrders() {
                showLoader(true);
                const orders = await apiFetch('new-orders');
                const list = document.getElementById('items-list');
                if (!orders || orders.length === 0) { list.innerHTML = '<p style="text-align:center; padding:2rem;">Немає нових замовлень</p>'; showLoader(false); return; }
                list.innerHTML = '';
                orders.forEach(o => {
                    const div = document.createElement('div'); div.className = 'order-item';
                    const date = o.created_at ? new Date(o.created_at).toLocaleString('uk-UA') : '—';
                    div.innerHTML = `
                        <div class="order-info">
                            <div class="order-title">#${o.order_number || String(o.order_id).slice(-6)} — ${o.fullname}</div>
                            <div class="order-meta">${date} | <b>${o.phone}</b> | ${o.total_amount} ₴</div>
                            <div class="order-items">${o.cart || ''}${o.wishes ? `<br><br><b>Побажання:</b> ${o.wishes}` : ''}</div>
                        </div>
                        <div class="order-actions">
                            <button class="btn btn--success btn--sm" onclick="confirmOrder('${o.order_id}')">Підтвердити</button>
                            <button class="btn btn--danger btn--sm" onclick="rejectOrder('${o.order_id}')">Відхилити</button>
                        </div>`;
                    list.appendChild(div);
                });
                showLoader(false);
            }

            async function confirmOrder(oid) { if (confirm('Підтвердити?')) { const res = await apiFetch(`orders/${oid}/confirm`, 'POST'); if (res) refreshData(); } }
            async function rejectOrder(oid) { if (confirm('Відхилити?')) { const res = await apiFetch(`orders/${oid}/reject`, 'POST'); if (res) refreshData(); } }

            async function loadOrders() {
                showLoader(true);
                const orders = await apiFetch('active-orders');
                const list = document.getElementById('items-list');
                list.innerHTML = orders?.length ? '' : '<p style="text-align:center; padding:2rem;">Немає активних замовлень</p>';
                orders?.forEach(o => {
                    const div = document.createElement('div'); div.className = 'order-item';
                    div.innerHTML = `<div class="order-info"><div class="order-title">#${o.order_number || String(o.order_id).slice(-6)} — ${o.fullname}</div><div class="order-meta">${o.phone} | ${o.location_name} | ${o.total} ₴</div><div class="order-items">${o.cart || ''}</div></div><div class="order-actions"><button class="btn btn--success btn--sm" onclick="completeOrder('${o.order_id}')">Готово</button></div>`;
                    list.appendChild(div);
                });
                showLoader(false);
            }

            async function completeOrder(oid) { if (confirm('Виконано?')) { await apiFetch(`orders/${oid}/complete`, 'POST'); refreshData(); } }

            async function loadBeans() {
                showLoader(true);
                const beans = await apiFetch('beans');
                const list = document.getElementById('items-list');
                if (!beans) { list.innerHTML = 'Немає доступу'; showLoader(false); return; }
                list.innerHTML = `<div class="admin-toolbar"><h3>Зерно</h3><button class="btn btn--primary btn--sm" onclick="openBeanModal()">+ Додати</button></div><div id="beans-grid" class="admin-grid"></div>`;
                beans.forEach(b => {
                    const div = document.createElement('div'); div.className = 'card'; div.style.padding = '1rem';
                    div.innerHTML = `<div style="display:flex; gap:1rem;"><div style="width:60px; height:60px; border-radius:10px; background:url('${window.fixImageUrl(b.image_url)}') center/cover;"></div><div style="flex:1;"><div style="font-weight:700;">${b.name}</div><div style="font-size:0.8rem; opacity:0.7;">${b.price_250} ₴ | ${b.roast || '—'}</div></div></div><div class="order-actions" style="margin-top:1rem;"><button class="btn btn--outline btn--sm" onclick='openBeanModal(${JSON.stringify(b).replace(/'/g, "&apos;")})'>Редагувати</button><button class="btn btn--danger btn--sm" onclick="deleteBean('${b.id}')">Видалити</button></div>`;
                    document.getElementById('beans-grid').appendChild(div);
                });
                showLoader(false);
            }

            async function uploadImage(file) {
                const formData = new FormData(); formData.append('file', file);
                try { const resp = await fetch('/api/admin/upload', { method: 'POST', headers: { 'Authorization': `Bearer ${sessionToken}` }, body: formData }); const res = await resp.json(); return res.url; } catch (e) { return null; }
            }

            function openBeanModal(b = null) {
                const modal = document.getElementById('admin-modal');
                modal.innerHTML = `
                    <div class="admin-modal__panel admin-modal__panel--large">
                        <div class="admin-modal__header"><h3>${b ? 'Редагувати' : 'Додати'} сорт</h3><button class="btn btn--outline btn--sm" onclick="closeAdminModal()">X</button></div>
                        <form id="bean-form"><div class="admin-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                            <div class="admin-field"><label>Назва</label><input name="name" value="${b?.name || ''}" required></div>
                            <div class="admin-field"><label>Категорія</label><select name="category"><option value="commercial" ${b?.category==='commercial'?'selected':''}>Комерційна</option><option value="specialty" ${b?.category==='specialty'?'selected':''}>Спешелті</option></select></div>
                            <div class="admin-field"><label>Ціна 250г</label><input type="number" name="price_250" value="${b?.price_250 || ''}" required></div>
                            <div class="admin-field"><label>Score / Grade</label><input name="quality_score" value="${b?.quality_score || ''}"></div>
                            <div class="admin-field"><label>Залишок</label><input type="number" name="stock_packs" value="${b?.stock_packs ?? ''}"></div>
                            <div class="admin-field"><label>Обсмажка</label><input name="roast" value="${b?.roast || ''}"></div>
                        </div><div class="admin-field" style="margin-top:1rem;"><label>Опис</label><textarea name="description" rows="3">${b?.description || ''}</textarea></div>
                        <div class="admin-field" style="margin-top:1.5rem;"><label>Фото</label><div style="display:flex; gap:1rem;"><img id="bean-img-preview" src="${window.fixImageUrl(b?.image_url)}" style="width:80px; height:80px; object-fit:cover;"><input type="file" id="bean-file-input"><input type="hidden" name="image_url" id="bean-image-url" value="${b?.image_url || ''}"></div></div></form>
                        <div class="admin-modal__footer"><button class="btn btn--primary" id="btn-save-bean">Зберегти</button></div>
                    </div>`;
                modal.classList.add('admin-modal--active');
                const fileInput = document.getElementById('bean-file-input');
                fileInput.onchange = async () => { if (fileInput.files[0]) { const url = await uploadImage(fileInput.files[0]); if (url) { document.getElementById('bean-image-url').value = url; document.getElementById('bean-img-preview').src = window.fixImageUrl(url); } } };
                document.getElementById('btn-save-bean').onclick = () => saveBean(b?.id);
            }

            async function saveBean(id) { const res = await apiFetch(id ? `beans/${id}` : 'beans', 'POST', Object.fromEntries(new FormData(document.getElementById('bean-form')).entries())); if (res) { closeAdminModal(); refreshData(); } }
            async function deleteBean(id) { if (confirm('Видалити?')) { await apiFetch(`beans/${id}`, 'DELETE'); refreshData(); } }

            async function loadLocations() {
                showLoader(true);
                const locs = await apiFetch('locations');
                const list = document.getElementById('items-list');
                if (!locs) { list.innerHTML = 'Немає доступу'; showLoader(false); return; }
                list.innerHTML = `<div class="admin-toolbar"><h3>Локації</h3><button class="btn btn--primary btn--sm" onclick="openLocationModal()">+ Додати</button></div><div id="locs-grid" class="admin-grid"></div>`;
                locs.forEach(l => {
                    const div = document.createElement('div'); div.className = 'card'; div.style.padding = '1rem';
                    div.innerHTML = `<div style="display:flex; gap:1rem;"><div style="width:60px; height:60px; border-radius:10px; background:url('${window.fixImageUrl(l.image_url)}') center/cover;"></div><div style="flex:1;"><div style="font-weight:700;">${l.name}</div><div style="font-size:0.8rem; opacity:0.7;">${l.address}</div></div></div><div class="order-actions" style="margin-top:1rem;"><button class="btn btn--outline btn--sm" onclick='openLocationModal(${JSON.stringify(l).replace(/'/g, "&apos;")})'>Редагувати</button><button class="btn btn--danger btn--sm" onclick="deleteLocation('${l.id}')">Видалити</button></div>`;
                    document.getElementById('locs-grid').appendChild(div);
                });
                showLoader(false);
            }

            function openLocationModal(l = null) {
                const modal = document.getElementById('admin-modal');
                modal.innerHTML = `
                    <div class="admin-modal__panel admin-modal__panel--large">
                        <div class="admin-modal__header"><h3>${l ? 'Редагувати' : 'Додати'} локацію</h3><button class="btn btn--outline btn--sm" onclick="closeAdminModal()">X</button></div>
                        <form id="loc-form"><div class="admin-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                            <div class="admin-field"><label>Назва</label><input name="name" value="${l?.name || ''}" required></div>
                            <div class="admin-field"><label>Адреса</label><input name="address" value="${l?.address || ''}" required></div>
                            <div class="admin-field"><label>Графік</label><input name="schedule" value="${l?.schedule || ''}"></div>
                            <div class="admin-field"><label>Maps URL</label><input name="google_maps_url" value="${l?.google_maps_url || ''}"></div>
                        </div><div class="admin-field" style="margin-top:1.5rem;"><label>Фото</label><div style="display:flex; gap:1rem;"><img id="loc-img-preview" src="${window.fixImageUrl(l?.image_url)}" style="width:120px; height:80px; object-fit:cover;"><input type="file" id="loc-file-input"><input type="hidden" name="image_url" id="loc-image-url" value="${l?.image_url || ''}"></div></div></form>
                        <div class="admin-modal__footer"><button class="btn btn--primary" id="btn-save-loc">Зберегти</button></div>
                    </div>`;
                modal.classList.add('admin-modal--active');
                const fileInput = document.getElementById('loc-file-input');
                fileInput.onchange = async () => { if (fileInput.files[0]) { const url = await uploadImage(fileInput.files[0]); if (url) { document.getElementById('loc-image-url').value = url; document.getElementById('loc-img-preview').src = window.fixImageUrl(url); } } };
                document.getElementById('btn-save-loc').onclick = () => saveLocation(l?.id);
            }

            async function saveLocation(id) { const fd = new FormData(document.getElementById('loc-form')); const data = Object.fromEntries(fd.entries()); const res = await apiFetch(id ? `locations/${id}` : 'locations', 'POST', data); if (res) { closeAdminModal(); refreshData(); } }
            async function deleteLocation(id) { if (confirm('Видалити?')) { await apiFetch(`locations/${id}`, 'DELETE'); refreshData(); } }

            async function loadSocials() {
                showLoader(true);
                const socials = await apiFetch('socials');
                const list = document.getElementById('items-list');
                if (!socials) { list.innerHTML = 'Немає доступу'; showLoader(false); return; }
                list.innerHTML = `<div class="admin-toolbar"><h3>Контакти</h3><button class="btn btn--primary btn--sm" onclick="openSocialModal()">+ Додати</button></div><div id="socials-list"></div>`;
                socials.forEach(s => {
                    const div = document.createElement('div'); div.className = 'order-item';
                    div.innerHTML = `<div class="order-info"><div style="font-weight:700;"><i class="fas fa-address-book"></i> ${s.name}</div><div style="font-size:0.9rem; opacity:0.7;">${s.url}</div></div><div class="order-actions"><button class="btn btn--outline btn--sm" onclick='openSocialModal(${JSON.stringify(s).replace(/'/g, "&apos;")})'>Редагувати</button><button class="btn btn--danger btn--sm" onclick="deleteSocial('${s.id}')">Видалити</button></div>`;
                    document.getElementById('socials-list').appendChild(div);
                });
                showLoader(false);
            }

            function openSocialModal(s = null) {
                const modal = document.getElementById('admin-modal');
                modal.innerHTML = `<div class="admin-modal__panel" style="max-width:400px;"><div class="admin-modal__header"><h3>${s ? 'Редагувати' : 'Додати'} контакт</h3><button class="btn btn--outline btn--sm" onclick="closeAdminModal()">X</button></div><form id="social-form"><div class="admin-field"><label>Назва</label><input name="name" value="${s?.name || ''}" required></div><div class="admin-field" style="margin-top:1rem;"><label>Дані</label><input name="url" value="${s?.url || ''}" required></div></form><div class="admin-modal__footer"><button class="btn btn--primary" onclick="saveSocial('${s?.id || ''}')">Зберегти</button></div></div>`;
                modal.classList.add('admin-modal--active');
            }
            async function saveSocial(id) { await apiFetch(id ? `socials/${id}` : 'socials', 'POST', Object.fromEntries(new FormData(document.getElementById('social-form')).entries())); closeAdminModal(); refreshData(); }
            async function deleteSocial(id) { if (confirm('Видалити?')) { await apiFetch(`socials/${id}`, 'DELETE'); refreshData(); } }

            async function loadStats() {
                showLoader(true);
                const stats = await apiFetch('stats');
                const list = document.getElementById('items-list');
                if (!stats) { list.innerHTML = 'Немає доступу'; showLoader(false); return; }
                list.innerHTML = `<div class="admin-toolbar"><h3>Статистика</h3></div><div class="admin-grid"><div class="card" style="text-align:center;">ВИРУЧКА: ${stats.total_revenue} ₴</div><div class="card" style="text-align:center;">ПРОДАЖІ: ${stats.total_sales}</div></div><div id="stats-recent"></div>`;
                stats.recent_sales?.forEach(s => { const div = document.createElement('div'); div.className = 'order-item'; div.innerHTML = `<div>${s.fullname}</div><div>${s.total} ₴</div>`; document.getElementById('stats-recent').appendChild(div); });
                showLoader(false);
            }

            async function loadBroadcast() {
                document.getElementById('items-list').innerHTML = `<div class="admin-toolbar"><h3>Розсилка</h3></div><div class="card"><textarea id="broadcast-msg" rows="6" style="width:100%;" placeholder="Текст розсилки..."></textarea><button class="btn btn--primary btn--block" onclick="sendBroadcast()" style="margin-top:1rem;">🚀 Запустити</button></div>`;
            }

            async function sendBroadcast() {
                const msg = document.getElementById('broadcast-msg').value; if (!msg || !confirm('Надіслати всім?')) return;
                showLoader(true); const res = await apiFetch('broadcast', 'POST', { message: msg }); showLoader(false);
                if (res) { alert(`Надіслано: ${res.sent_to}/${res.total}`); document.getElementById('broadcast-msg').value = ''; }
            }

            async function loadTeam() {
                showLoader(true); const [team, locs] = await Promise.all([apiFetch('team'), apiFetch('locations')]);
                const list = document.getElementById('items-list'); if (!team) { list.innerHTML = 'Немає доступу'; showLoader(false); return; }
                list.innerHTML = `<div class="admin-toolbar"><h3>Персонал</h3><button class="btn btn--primary btn--sm" onclick='openTeamModal(null, ${JSON.stringify(locs)})'>+ Додати</button></div><div id="team-list"></div>`;
                team.forEach(t => { const div = document.createElement('div'); div.className = 'order-item'; div.innerHTML = `<div>${t[2]} (@${t[1]}) - ${roleName(t[3])}</div><button class="btn btn--danger btn--sm" onclick="deleteTeam('${t[0]}')">Видалити</button>`; document.getElementById('team-list').appendChild(div); });
                showLoader(false);
            }

            function openTeamModal(t = null, allLocs = []) {
                const modal = document.getElementById('admin-modal');
                modal.innerHTML = `<div class="admin-modal__panel"><div class="admin-modal__header"><h3>Додати</h3><button onclick="closeAdminModal()">X</button></div><form id="team-form"><div class="admin-field"><label>TG ID / @username</label><input name="user_id" required></div><div class="admin-field"><label>Ім'я</label><input name="display_name" required></div><div class="admin-field"><label>Роль</label><select name="role"><option value="admin">Адмін</option><option value="owner">Власник</option></select></div><div style="max-height:150px; overflow-y:auto;">${(allLocs||[]).map(l=>`<label><input type="checkbox" name="locations" value="${l.id}"> ${l.name}</label><br>`).join('')}</div></form><button onclick="saveTeam()" class="btn btn--primary">Зберегти</button></div>`;
                modal.classList.add('admin-modal--active');
            }

            async function saveTeam() { const form = document.getElementById('team-form'); const fd = new FormData(form); const data = { user_id: fd.get('user_id'), display_name: fd.get('display_name'), role: fd.get('role'), locations: [] }; form.querySelectorAll('input[name="locations"]:checked').forEach(cb => data.locations.push(cb.value)); const res = await apiFetch('team', 'POST', data); if (res) { closeAdminModal(); refreshData(); } }
            async function deleteTeam(id) { if (confirm('Видалити?')) { await apiFetch(`team/${id}`, 'DELETE'); refreshData(); } }

            function closeAdminModal() { document.getElementById('admin-modal').classList.remove('admin-modal--active'); }

            function refreshData() {
                if (currentSection === 'new_orders') loadNewOrders();
                else if (currentSection === 'orders') loadOrders();
                else if (currentSection === 'beans') loadBeans();
                else if (currentSection === 'locations') loadLocations();
                else if (currentSection === 'socials') loadSocials();
                else if (currentSection === 'stats') loadStats();
                else if (currentSection === 'broadcast') loadBroadcast();
                else if (currentSection === 'team') loadTeam();
            }

            document.getElementById('refresh-btn').onclick = refreshData;
            if (sessionToken && currentAdmin) { document.getElementById('login-screen').style.display = 'none'; showPanel(); }
        </script>
    </body>
</html>
