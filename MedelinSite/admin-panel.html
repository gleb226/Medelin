<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Medelin | Admin Panel</title>
        <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ50BUE2d30GBASKRdrCoBgrFBfvjFTiAKCYA&s" type="image/png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
        <style>
            :root {
                --color-cream: #f7f3e9;
                --color-dark-brown: #3c2f2f;
                --color-coffee: #8b5e3c;
                --color-coffee-soft: rgba(139, 94, 60, 0.1);
                --color-text: #2d3436;
                --color-text-muted: #636e72;
                --sidebar-width: 280px;
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
                --radius: 20px;
                --font-main: 'Manrope', sans-serif;
                --font-accent: 'Marcellus', serif;
            }

            * { box-sizing: border-box; margin: 0; padding: 0; }

            body {
                font-family: var(--font-main);
                background-color: var(--color-cream);
                color: var(--color-text);
                display: flex;
                min-height: 100vh;
                overflow-x: hidden;
            }

            html, body { scrollbar-width: none; -ms-overflow-style: none; }
            html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

            #login-screen {
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: var(--color-cream);
                display: flex; justify-content: center; align-items: center;
                z-index: 5000; transition: all 0.5s ease;
            }

            .login-card {
                background: white; padding: 3rem; border-radius: 30px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.1);
                width: 100%; max-width: 450px; text-align: center;
            }

            .login-logo { font-family: var(--font-accent); font-size: 3rem; color: var(--color-dark-brown); margin-bottom: 0.5rem; }
            .login-subtitle { color: var(--color-coffee); font-weight: 800; font-size: 0.8rem; letter-spacing: 3px; margin-bottom: 2.5rem; text-transform: uppercase; }

            .input-group { margin-bottom: 1.5rem; text-align: left; }
            .input-label { display: block; margin-bottom: 0.6rem; font-weight: 700; font-size: 0.9rem; color: var(--color-dark-brown); }
            .login-input {
                width: 100%; padding: 1.2rem; border-radius: 15px; border: 2px solid var(--color-coffee-soft);
                font-family: var(--font-main); font-size: 1rem; outline: none; transition: all 0.3s;
            }
            .login-input:focus { border-color: var(--color-coffee); background: #fffdfa; }

            #verify-state { display: none; }
            .verify-pulse {
                width: 80px; height: 80px; background: var(--color-coffee-soft);
                border-radius: 50%; margin: 2rem auto; display: flex; align-items: center; justify-content: center;
                position: relative;
            }
            .verify-pulse::after {
                content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
                border: 4px solid var(--color-coffee); border-radius: 50%;
                animation: pulse 2s infinite;
            }
            @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

            .sidebar {
                width: var(--sidebar-width); background: var(--color-dark-brown);
                color: white; display: flex; flex-direction: column; position: fixed; height: 100vh;
                transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                z-index: 2000; box-shadow: 10px 0 30px rgba(0,0,0,0.1);
            }

            .main-content {
                flex: 1; margin-left: var(--sidebar-width); padding: 3rem;
                width: calc(100% - var(--sidebar-width)); transition: all 0.4s ease;
            }

            .sidebar__header { padding: 3rem 2rem; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
            .sidebar__logo { font-family: var(--font-accent); font-size: 2.2rem; letter-spacing: 3px; color: white; text-decoration: none; display: block; }
            .sidebar__nav { flex: 1; padding: 2rem 0; overflow-y: auto; }
            .nav-item { padding: 1.2rem 2.5rem; display: flex; align-items: center; gap: 1.2rem; cursor: pointer; transition: all 0.3s ease; color: rgba(255, 255, 255, 0.6); text-decoration: none; font-weight: 500; border-left: 4px solid transparent; }
            .nav-item:hover, .nav-item--active { background-color: rgba(255, 255, 255, 0.05); color: white; border-left-color: var(--color-coffee); }
            .nav-item i { width: 24px; text-align: center; font-size: 1.2rem; }

            .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; gap: 1rem; }
            .header__title { font-family: var(--font-accent); font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 400; color: var(--color-dark-brown); }

            .card { background: white; border-radius: var(--radius); padding: clamp(1.5rem, 4vw, 2.5rem); box-shadow: var(--shadow); margin-bottom: 2rem; border: 1px solid rgba(139, 94, 60, 0.05); }

            .btn { padding: 0.8rem 1.5rem; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; transition: all 0.3s ease; font-family: var(--font-main); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap; }
            .btn--primary { background-color: var(--color-coffee); color: white; box-shadow: 0 4px 15px rgba(139, 94, 60, 0.3); }
            .btn--primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139, 94, 60, 0.4); }
            .btn--block { width: 100%; justify-content: center; padding: 1.2rem; font-size: 1.1rem; }
            .btn--success { background-color: #55efc4; color: var(--color-dark-brown); }
            .btn--danger { background-color: #ff7675; color: white; }
            .btn--outline { background: transparent; border: 2px solid var(--color-coffee); color: var(--color-coffee); }
            .btn--sm { padding: 0.5rem 1rem; font-size: 0.85rem; border-radius: 8px; }

            .order-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); padding: 1.5rem 0; gap: 1.5rem; }
            .order-item:last-child { border-bottom: none; }
            .order-info { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
            .order-title { font-weight: 800; font-size: 1.2rem; color: var(--color-dark-brown); }
            .order-meta { color: var(--color-text-muted); font-size: 0.95rem; }
            .order-items { margin-top: 0.8rem; font-size: 1rem; color: #444; background: var(--color-coffee-soft); padding: 1rem; border-radius: 12px; }
            .order-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: flex-end; }

            .admin-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
            .admin-toolbar h3 { font-family: var(--font-accent); color: var(--color-dark-brown); font-size: 1.7rem; font-weight: 400; }
            .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
            .admin-field { display: flex; flex-direction: column; gap: 0.45rem; }
            .admin-field label { font-size: 0.82rem; font-weight: 800; color: var(--color-dark-brown); }
            .admin-field input, .admin-field select, .admin-field textarea {
                width: 100%; padding: 0.9rem 1rem; border: 2px solid var(--color-coffee-soft);
                border-radius: 12px; font-family: var(--font-main); font-size: 0.95rem; outline: none; background: #fffdfa;
            }
            .admin-modal { position: fixed; inset: 0; background: rgba(60, 47, 47, 0.38); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 1rem; }
            .admin-modal--active { display: flex; }
            .admin-modal__panel { width: min(880px, 100%); max-height: min(88vh, 900px); overflow-y: auto; background: white; border-radius: var(--radius); padding: clamp(1.2rem, 3vw, 2rem); box-shadow: 0 25px 70px rgba(0,0,0,0.18); }
            .admin-modal__header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
            .admin-modal__title { font-family: var(--font-accent); color: var(--color-dark-brown); font-size: 1.9rem; font-weight: 400; }
            .admin-modal__footer { display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem; flex-wrap: wrap; }

            .loader-wrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(247, 243, 233, 0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
            .spinner { width: 60px; height: 60px; border: 6px solid rgba(139, 94, 60, 0.1); border-top-color: var(--color-coffee); border-radius: 50%; animation: spin 1s linear infinite; }
            @keyframes spin { to { transform: rotate(360deg); } }

            .sidebar-toggle {
                display: none; width: 45px; height: 45px; background: var(--color-dark-brown); color: white;
                border-radius: 10px; align-items: center; justify-content: center; cursor: pointer; border: none;
                font-size: 1.2rem;
            }

            @media (max-width: 1024px) {
                .sidebar { transform: translateX(-100%); }
                .sidebar--active { transform: translateX(0); }
                .main-content { margin-left: 0; width: 100%; padding: 1.5rem; }
                .sidebar-toggle { display: flex; }
            }
        </style>
    </head>
    <body>
        <button class="sidebar-toggle" id="menu-toggle" style="position:fixed; top:1.5rem; right:1.5rem; z-index:2100;">
            <i class="fas fa-bars"></i>
        </button>

        <div id="login-screen">
            <div class="login-card">
                <div id="login-form">
                    <h1 class="login-logo">MEDELIN</h1>
                    <p class="login-subtitle">Admin Access</p>
                    <div class="input-group">
                        <label class="input-label">Ідентифікатор</label>
                        <input type="text" id="login-id" class="login-input" placeholder="@uzh_boss">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Код доступу</label>
                        <input type="password" id="login-pass" class="login-input" placeholder="••••">
                    </div>
                    <button class="btn btn--primary btn--block" onclick="attemptLogin()">Увійти</button>
                </div>
                <div id="verify-state">
                    <h2 style="font-family:var(--font-accent);">Підтвердження</h2>
                    <p>Натисніть <b>"Підтвердити"</b> у Telegram для входу.</p>
                    <div class="verify-pulse"><i class="fab fa-telegram-plane" style="font-size:2rem; color:var(--color-coffee);"></i></div>
                    <button class="btn btn--outline" onclick="resetLogin()">Скасувати</button>
                </div>
            </div>
        </div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header">
                <a href="index.html" class="sidebar__logo">MEDELIN</a>
            </div>
            <nav class="sidebar__nav">
                <a class="nav-item nav-item--active" data-section="orders"><i class="fas fa-shopping-bag"></i> Замовлення</a>
                <a class="nav-item" data-section="beans"><i class="fas fa-coffee"></i> Зерно</a>
                <a class="nav-item" data-section="locations"><i class="fas fa-map-marker-alt"></i> Локації</a>
                <a class="nav-item" data-section="socials"><i class="fas fa-share-nodes"></i> Соцмережі</a>
                <a class="nav-item" data-section="team"><i class="fas fa-users-gear"></i> Команда</a>
            </nav>
            <div style="padding: 2rem; border-top: 1px solid rgba(255,255,255,0.05);">
                <a href="index.html" class="nav-item" style="padding: 0;"><i class="fas fa-arrow-left"></i> На сайт</a>
            </div>
        </aside>

        <main class="main-content" id="main-content">
            <header class="header">
                <div>
                    <h2 class="header__title" id="section-title">Замовлення</h2>
                    <p id="admin-info" style="font-size:0.85rem; color:var(--color-coffee); font-weight:700;"></p>
                </div>
                <div class="header__actions">
                    <button class="btn btn--primary" id="refresh-btn"><i class="fas fa-sync-alt"></i> Оновити</button>
                    <button class="btn btn--outline" onclick="logout()">Вийти</button>
                </div>
            </header>
            <div id="content-area"><div class="card"><div id="items-list">Завантаження...</div></div></div>
        </main>

        <div class="loader-wrap" id="loader"><div class="spinner"></div></div>
        <div class="admin-modal" id="admin-modal"></div>

        <script>
            let sessionToken = localStorage.getItem('medelin_admin_token') || '';
            let currentAdmin = JSON.parse(localStorage.getItem('medelin_admin_user') || 'null');
            let currentSection = 'orders';
            let verifyInterval = null;

            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            menuToggle.onclick = () => sidebar.classList.toggle('sidebar--active');

            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const sec = item.getAttribute('data-section');
                    if (!sec) return;
                    currentSection = sec;
                    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('nav-item--active'));
                    item.classList.add('nav-item--active');
                    document.getElementById('section-title').textContent = item.textContent.trim();
                    refreshData();
                });
            });

            async function attemptLogin() {
                const id = document.getElementById('login-id').value;
                const pass = document.getElementById('login-pass').value;
                if (!id || !pass) return alert('Введіть дані');
                showLoader(true);
                try {
                    const resp = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identifier: id, password: pass })
                    });
                    if (!resp.ok) throw new Error('Помилка входу');
                    const data = await resp.json();
                    startVerification(data.user_id);
                } catch (e) { alert(e.message); } finally { showLoader(false); }
            }

            function startVerification(userId) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('verify-state').style.display = 'block';
                verifyInterval = setInterval(async () => {
                    try {
                        const resp = await fetch(`/api/admin/verify?user_id=${userId}`);
                        const data = await resp.json();
                        if (data.status === 'ok') { clearInterval(verifyInterval); finishLogin(data.token, data.admin); }
                    } catch (e) {}
                }, 2000);
            }

            function finishLogin(token, admin) {
                sessionToken = token; currentAdmin = admin;
                localStorage.setItem('medelin_admin_token', token);
                localStorage.setItem('medelin_admin_user', JSON.stringify(admin));
                location.reload();
            }

            function showPanel() {
                document.getElementById('admin-info').textContent = `${currentAdmin.name} (${roleName(currentAdmin.role)})`;
                const restricted = ['beans', 'locations', 'socials', 'team'];
                document.querySelectorAll('.nav-item[data-section]').forEach(item => {
                    const sec = item.getAttribute('data-section');
                    if (restricted.includes(sec) && !['boss', 'owner', 'developer'].includes(currentAdmin.role)) {
                        item.style.display = 'none';
                    }
                });
                refreshData();
            }

            function logout() { localStorage.removeItem('medelin_admin_token'); localStorage.removeItem('medelin_admin_user'); location.reload(); }
            function resetLogin() { clearInterval(verifyInterval); document.getElementById('login-form').style.display = 'block'; document.getElementById('verify-state').style.display = 'none'; }
            function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
            function roleName(role) { return ({ developer: 'Розробник', owner: 'Власник', boss: 'Власник', delivery_manager: 'Менеджер доставки' }[role] || role); }

            async function apiFetch(endpoint, method = 'GET', body = null) {
                const options = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` } };
                if (body) options.body = JSON.stringify(body);
                const resp = await fetch(`/api/admin/${endpoint}`, options);
                if (resp.status === 401) return logout();
                return resp.ok ? await resp.json() : null;
            }

            async function loadOrders() {
                showLoader(true);
                const orders = await apiFetch('active-orders');
                const list = document.getElementById('items-list');
                list.innerHTML = orders?.length ? '' : '<p style="text-align:center; padding:2rem;">Немає замовлень</p>';
                orders?.forEach(o => {
                    const div = document.createElement('div');
                    div.className = 'order-item';
                    div.innerHTML = `<div class="order-info"><div class="order-title">#${String(o.order_id).slice(-6)} — ${o.fullname}</div><div class="order-meta">${o.phone} | ${o.location_name}</div><div class="order-items">${o.cart || ''}</div></div><div class="order-actions"><button class="btn btn--success btn--sm" onclick="completeOrder('${o.order_id}')">Готово</button></div>`;
                    list.appendChild(div);
                });
                showLoader(false);
            }

            async function completeOrder(oid) { if (confirm('Виконано?')) { await apiFetch(`orders/${oid}/complete`, 'POST'); loadOrders(); } }

            function refreshData() { if (currentSection === 'orders') loadOrders(); }

            document.getElementById('refresh-btn').onclick = refreshData;
            if (sessionToken && currentAdmin) { document.getElementById('login-screen').style.display = 'none'; showPanel(); }
        </script>
    </body>
</html>
