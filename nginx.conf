server {
    listen 80;
    server_name localhost;
    charset utf-8;
    server_tokens off;
    include /etc/nginx/mime.types;

    add_header X-Content-Type-Options "nosniff" always;
    # add_header X-Frame-Options "DENY" always;
    # add_header Content-Security-Policy "..." always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:env|ini|log|sql|bak|old|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Static site
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Bot API (reverse proxy)
    location /api/ {
        limit_except GET POST OPTIONS {
            deny all;
        }

        # In the production image (Render) nginx and the API run in the same container,
        # so the upstream is localhost.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Admin Panel (reverse proxy to handle stealth logic in FastAPI)
    location /admin-panel {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        alias /app/uploads/;
        try_files $uri =404;
    }

    client_max_body_size 10M;
}
